// ── 상태 ──────────────────────────────────────────────
var S={
  tab:0, yr:new Date().getFullYear(), mo:new Date().getMonth()+1,
  cos:[], txs:[], cid:null, search:"",
  tDate:today(), tComp:"", tItem:"장어", tFish:"", tQty:"", tPrice:"",
  dDate:today(), dComp:"", dAmt:"", dNeg:false,
  tMsg:"", dMsg:"",

  delMode:false, delTxt:"",
  user:null, authReady:false, adminTab:0
};
var saveT=null;
function today(){return new Date().toISOString().slice(0,10);}
function fmt(n){return(n||0).toLocaleString()+"원";}
function cs(id){return String(id||"");}
function gName(id){var c=S.cos.find(function(c){return cs(c.id)===cs(id);});return c?c.name:"?";}
function pNum(v){
  if(!v&&v!==0)return 0;
  var s=v.toString().replace(/[원,\s]/g,"").trim();
  if(!s||s==="-")return 0;
  var neg=s.startsWith("-")||(s.startsWith("(")&&s.endsWith(")"));
  var inner=s.replace(/^\((.+)\)$/,"$1").replace(/^-/,"");
  var n=parseFloat(inner.replace(/[^0-9.]/g,""));
  if(isNaN(n))return 0;
  return neg?-n:n;
}
function pDate(v,yr){
  if(!v)return null;
  var m=v.toString().trim().match(/(\d{1,2})월\s*(\d{1,2})일/);
  if(!m)return null;
  return (yr||new Date().getFullYear())+"-"+String(parseInt(m[1])).padStart(2,"0")+"-"+String(parseInt(m[2])).padStart(2,"0");
}
var MONTHS=["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];

function saveToFb(co,tx){
  S.sync="saving"; render();
  if(saveT)clearTimeout(saveT);
  saveT=setTimeout(function(){
    if(!DB){S.sync="error";render();return;}
    Promise.all([
      DB.ref("hjsu/companies").set(co.length?co:null),
      DB.ref("hjsu/txList").set(tx.length?tx:null)
    ]).then(function(){S.sync="synced";render();}).catch(function(){S.sync="error";render();});
  },800);
}
function updCo(v){S.cos=v;saveToFb(v,S.txs);}
function updTx(v){S.txs=v;saveToFb(S.cos,v);}

// ── 미수금 계산 ─────────────────────────────────────
// 납품 = +금액(우리가 받을 돈), 입금 = -금액(받은 돈)
// 미수금잔액 = 그대로 반영 (음수면 우리가 줘야 할 돈)
function getRecv(){
  var m={};
  S.cos.forEach(function(c){m[cs(c.id)]=0;});
  S.txs.forEach(function(t){if(m[cs(t.companyId)]!==undefined)m[cs(t.companyId)]+=t.amount;});
  return m;
}

// ── DOM 헬퍼 ─────────────────────────────────────────
function h(tag,cls,style,children){
  var e=document.createElement(tag);
  if(cls)e.className=cls;
  if(style)Object.assign(e.style,style);
  if(children)(Array.isArray(children)?children:[children]).forEach(function(c){
    if(c==null||c===false)return;
    if(typeof c==="string"||typeof c==="number")e.appendChild(document.createTextNode(String(c)));
    else if(c instanceof Node)e.appendChild(c);
  });
  return e;
}
function d(cls,style,children){return h("div",cls,style,children);}
function t(cls,style,txt){var e=h("p",cls,style);e.textContent=String(txt==null?"":txt);return e;}
function sp(cls,style,txt){var e=h("span",cls,style);e.textContent=String(txt==null?"":txt);return e;}
function badge(bg,col,bor,txt){return sp(null,{fontSize:11,background:bg,color:col,border:"1px solid "+bor,borderRadius:6,padding:"2px 8px",flexShrink:0,whiteSpace:"nowrap"},txt);}
function inpEl(type,cls,style,val,onInput){var e=h("input",cls,style);e.type=type||"text";if(val!=null)e.value=String(val);if(onInput)e.oninput=onInput;return e;}
function selEl(cls,val,opts,onChange){
  var e=h("select",cls);
  opts.forEach(function(o){var op=h("option");op.value=o.v;op.textContent=o.t;if(String(o.v)===String(val))op.selected=true;e.appendChild(op);});
  if(onChange)e.onchange=onChange;
  return e;
}
function txBadge(tx){
  if(tx.type==="입금")return badge("rgba(76,175,130,0.12)","#4CAF82","rgba(76,175,130,0.3)","입금");
  if(tx.item==="잡어")return badge("rgba(91,141,239,0.12)","#5B8DEF","rgba(91,141,239,0.3)","잡어"+(tx.fish?"("+tx.fish+")":""));
  if(tx.item==="미수금잔액")return badge("rgba(224,92,92,0.12)","#E05C5C","rgba(224,92,92,0.3)","미수잔액");
  return badge("rgba(201,168,76,0.12)","#E8C97A","rgba(201,168,76,0.35)","장어");
}

// ── 임포트 파싱 ──────────────────────────────────────
function parseImp(){
  var imp=S.imp, yr=parseInt(imp.year)||new Date().getFullYear();
  var nCos=[], nTxs=[];
  if(imp.mode==="normal"){
    imp.text.split("\n").forEach(function(line,li){
      var cols=line.split("\t").map(function(c){return c.trim();});
      if(cols.length<2)return;
      var date=pDate(cols[0],yr), name=cols[1];
      if(!date||!name||name==="업체명"||!name||name==="날 짜")return;
      var all=S.cos.concat(nCos), comp=all.find(function(c){return c.name===name;});
      if(!comp){comp={id:"co_"+Date.now()+"_"+li+"_"+Math.random().toString(36).slice(2,6),name:name};nCos.push(comp);}
      var qty=Math.abs(pNum(cols[2])), price=Math.abs(pNum(cols[3]));
      // 총단가: 양수=받을돈(+), 음수/()=줘야할돈(-)
      var totalRaw=pNum(cols[4]);
      var totalAmt=totalRaw!==0?totalRaw:(qty>0&&price>0?qty*price:0);
      // 입금액: 양수=우리가준돈(+미수금감소방향반전), 음수/()=우리가받은돈(-미수금)
      var depositRaw=pNum(cols[5]);
      var fishAmt=Math.abs(pNum(cols[6])), fishQty=cols[7]?parseFloat(cols[7].replace(/[^0-9.]/g,""))||0:0;
      var fishPrice=Math.abs(pNum(cols[8])), fishName=(cols[9]||"").trim().split(/[\s(]/)[0];
      // 장어 납품: 총단가 부호 그대로 반영
      if(qty>0&&price>0&&totalAmt!==0)nTxs.push({id:"tx_"+yr+"_"+li+"_e_"+Date.now()+"_"+Math.random().toString(36).slice(2),date:date,companyId:comp.id,type:"납품",item:"장어",fish:"",qty:qty,price:price,amount:totalAmt});
      // 잡어 납품: 항상 양수
      if(fishAmt>0&&fishQty>0&&fishName&&fishName!=="0")nTxs.push({id:"tx_"+yr+"_"+li+"_f_"+Date.now()+"_"+Math.random().toString(36).slice(2),date:date,companyId:comp.id,type:"납품",item:"잡어",fish:fishName,qty:fishQty,price:fishPrice,amount:fishAmt});
      // 입금액: 양수=준돈(+), 음수=받은돈(-)
      // 미수금 로직: 받을돈이면 입금받으면 미수금 감소(-), 줘야할돈이면 입금하면 미수금 증가(+)
      // 엑셀에서 양수입금=우리가준돈=줘야할돈감소=미수금+, 음수입금=우리가받은돈=받을돈감소=미수금-
      if(depositRaw!==0){
        var depAmt=depositRaw>0?depositRaw:-depositRaw;
        var depSign=depositRaw>0?1:-1; // 양수입금=준돈=미수금증가방향
        nTxs.push({id:"tx_"+yr+"_"+li+"_d_"+Date.now()+"_"+Math.random().toString(36).slice(2),date:date,companyId:comp.id,type:"입금",item:"",fish:"",qty:0,price:0,amount:depSign*depAmt});
      }
    });
  }else{
    imp.text.split("\n").forEach(function(line,li){
      var cols=line.split("\t").map(function(c){return c.trim();}).filter(Boolean);
      if(cols.length<2)return;
      var name="",amtRaw="",dStr=yr+"-12-31";
      if(pDate(cols[0],yr)&&cols.length>=3){dStr=pDate(cols[0],yr)||dStr;name=cols[1];amtRaw=cols[2];}
      else{name=cols[0];amtRaw=cols[1];}
      if(!name||name==="업체명")return;
      // 음수 포함 그대로 파싱
      var amt=pNum(amtRaw);
      if(amt===0)return;
      var all=S.cos.concat(nCos), comp=all.find(function(c){return c.name===name;});
      if(!comp){comp={id:"co_"+Date.now()+"_"+li+"_"+Math.random().toString(36).slice(2,6),name:name};nCos.push(comp);}
      nTxs.push({id:"tx_bal_"+yr+"_"+li+"_"+Date.now()+"_"+Math.random().toString(36).slice(2),date:dStr,companyId:comp.id,type:"납품",item:"미수금잔액",fish:"",qty:0,price:0,amount:amt});
    });
  }
  S.imp.res={nCos:nCos,nTxs:nTxs};
  S.imp.msg=nTxs.length===0&&nCos.length===0?"❌ 파싱된 데이터가 없습니다.":"";
  render();
}


// ── 로그인 화면 ──────────────────────────────────────
function renderLogin(){
  var app=document.getElementById("app");
  app.innerHTML="";
  var wrap=d(null,{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"24px",background:"#0D1117"});
  var card=d("card-gold",{maxWidth:"360px",width:"100%",margin:"0 auto",padding:"32px 24px"});
  var errMsg=sp(null,{color:"#E05C5C",fontSize:12,display:"block",marginBottom:8,minHeight:18},"");
  var title=d(null,{textAlign:"center",marginBottom:24},[
    t(null,{fontSize:22,fontWeight:700,color:"#E8C97A",margin:"0 0 4px"},"홍장어 수산"),
    t(null,{fontSize:12,color:"rgba(240,234,214,0.45)",margin:0},"관리 시스템 로그인")
  ]);
  var emailInp=inpEl("email","inp",{marginBottom:10},"");
  emailInp.placeholder="이메일";
  var pwInp=inpEl("password","inp",{marginBottom:16},"");
  pwInp.placeholder="비밀번호";
  var loginBtn=document.createElement("button");
  loginBtn.style.cssText="width:100%;padding:13px;border:none;border-radius:10px;background:linear-gradient(135deg,#C9A84C,#E8C97A);color:#0D1117;font-size:15px;font-weight:700;cursor:pointer;";
  loginBtn.textContent="로그인";
  loginBtn.onclick=function(){
    var email=emailInp.value.trim(),pw=pwInp.value;
    if(!email||!pw){errMsg.textContent="이메일과 비밀번호를 입력하세요.";return;}
    loginBtn.textContent="로그인 중...";loginBtn.disabled=true;
    AUTH.signInWithEmailAndPassword(email,pw)
      .then(function(){errMsg.textContent="";})
      .catch(function(e){
        errMsg.textContent=e.code==="auth/wrong-password"||e.code==="auth/user-not-found"?"이메일 또는 비밀번호가 올바르지 않습니다.":"로그인 실패: "+e.message;
        loginBtn.textContent="로그인";loginBtn.disabled=false;
      });
  };
  pwInp.onkeydown=function(e){if(e.key==="Enter")loginBtn.click();};
  card.appendChild(title);card.appendChild(errMsg);card.appendChild(emailInp);card.appendChild(pwInp);card.appendChild(loginBtn);
  wrap.appendChild(card);app.appendChild(wrap);
}

// ── 계정 관리 탭 ──────────────────────────────────────
function renderAdmin(page){
  var user=S.user;
  page.appendChild(d(null,{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16},[
    t("sec-title",{margin:0},"계정 관리"),
    (function(){var b=document.createElement("button");b.style.cssText="padding:8px 16px;border:none;border-radius:8px;background:#E05C5C;color:#fff;font-size:12px;font-weight:600;cursor:pointer;";b.textContent="로그아웃";b.onclick=function(){AUTH.signOut();};return b;})()
  ]));
  // 현재 계정 정보
  page.appendChild(d("card",null,[
    t("sec-title",null,"현재 계정"),
    d(null,{display:"flex",flexDirection:"column",gap:8},[
      d(null,{display:"flex",justifyContent:"space-between",alignItems:"center"},[sp(null,{color:"rgba(240,234,214,0.55)"},"이메일"),sp(null,{color:"#F0EAD6",fontWeight:600},user?user.email:"")]),
      d(null,{display:"flex",justifyContent:"space-between",alignItems:"center"},[sp(null,{color:"rgba(240,234,214,0.55)"},"권한"),sp(null,{color:"#E8C97A"},S.userRole==="master"?"마스터":"스태프")])
    ])
  ]));
  // 비밀번호 변경
  var pwMsg=sp(null,{fontSize:12,display:"block",minHeight:16,marginBottom:6},"");
  var pw1=inpEl("password","inp",{marginBottom:8},"");pw1.placeholder="새 비밀번호 (6자 이상)";
  var pw2=inpEl("password","inp",{marginBottom:8},"");pw2.placeholder="새 비밀번호 확인";
  var pwBtn=document.createElement("button");
  pwBtn.style.cssText="width:100%;padding:11px;border:none;border-radius:10px;background:linear-gradient(135deg,#C9A84C,#E8C97A);color:#0D1117;font-size:14px;font-weight:700;cursor:pointer;";
  pwBtn.textContent="비밀번호 변경";
  pwBtn.onclick=function(){
    if(pw1.value.length<6){pwMsg.style.color="#E05C5C";pwMsg.textContent="6자 이상 입력하세요.";return;}
    if(pw1.value!==pw2.value){pwMsg.style.color="#E05C5C";pwMsg.textContent="비밀번호가 일치하지 않습니다.";return;}
    user.updatePassword(pw1.value).then(function(){
      pwMsg.style.color="#4CAF82";pwMsg.textContent="✓ 비밀번호가 변경되었습니다.";
      pw1.value="";pw2.value="";
    }).catch(function(e){pwMsg.style.color="#E05C5C";pwMsg.textContent="변경 실패: "+e.message;});
  };
  page.appendChild(d("card",null,[t("sec-title",null,"비밀번호 변경"),pwMsg,pw1,pw2,pwBtn]));

// ── qty 보정 마이그레이션 ───────────────────────────────
function migrateQty(txList){
  var changed=false;
  var result=txList.map(function(tx){
    if(tx.type==="납품"&&tx.amount<0&&tx.qty>0){
      changed=true;return Object.assign({},tx,{qty:-tx.qty});
    }
    return tx;
  });
  return {list:result,changed:changed};
}

// ── Firebase Auth + 리스너 ────────────────────────────
var _fbListenersOn=false;
if(AUTH&&DB){
  AUTH.onAuthStateChanged(function(user){
    console.log("DEBUG onAuthStateChanged: "+(user?user.email:"로그아웃"));
    S.user=user;
    S.authReady=true;
    if(user){
      DB.ref("hjsu/admins/"+user.uid).once("value").then(function(snap){
        if(!snap.val()){
          // 최초 마스터 계정 자동 등록
          if(user.uid==="ShFPC0m2hkQIVnvp0OPLBZnHxd13"){
            DB.ref("hjsu/admins/ShFPC0m2hkQIVnvp0OPLBZnHxd13").set({email:user.email,role:"master"}).then(function(){
              S.userRole="master";render();
            });
            return;
          }
          S.userRole="staff";
        } else {
          S.userRole=snap.val().role;
        }
        render();
      });
      if(!_fbListenersOn){
        _fbListenersOn=true;
        fbOn("hjsu/companies",function(v){
          S.cos=v?(Array.isArray(v)?v.filter(Boolean):Object.values(v).filter(Boolean)):[];
          S.sync="synced";render();
        });
        fbOn("hjsu/txList",function(v){
          var raw=v?(Array.isArray(v)?v.filter(Boolean):Object.values(v).filter(Boolean)):[];
          var m=migrateQty(raw);
          S.txs=m.list;S.sync="synced";render();
          if(m.changed){
            console.log("[마이그레이션] qty 보정, Firebase 저장 중...");
            DB.ref("hjsu/txList").set(m.list.length?m.list:null);
          }
        });
      }
    }else{
      S.sync="loading";
      render();
    }
  });
}else{S.sync="error";S.authReady=true;render();}
